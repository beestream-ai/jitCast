<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" role="img" aria-label="jitcast">
  <title>jitcast</title>
  <g transform="translate(8,8)">
    <rect width="144" height="144" rx="32" fill="#0B1F33"/>
    <!-- quantile band of the forecasts -->
    <path d="M72 62 L136 24 L136 116 Z" fill="#FF7A1A" fill-opacity="0.16"/>
    <path d="M72 62 L136 42 L136 92 Z" fill="#FF7A1A" fill-opacity="0.28"/>
    <!-- history -->
    <path d="M12 94 L24 82 L34 90 L46 68 L58 78 L72 62" fill="none" stroke="#E8F1FA" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- forecast start -->
    <line x1="72" y1="22" x2="72" y2="126" stroke="#E8F1FA" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 5"/>
    <!-- several models cast forward from the same point -->
    <path d="M72 62 C92 50 110 40 132 34" fill="none" stroke="#FF7A1A" stroke-width="5" stroke-linecap="round"/>
    <path d="M72 62 C94 62 112 66 132 64" fill="none" stroke="#FFB36B" stroke-width="5" stroke-linecap="round"/>
    <path d="M72 62 C92 76 110 88 132 96" fill="none" stroke="#4FD1C5" stroke-width="5" stroke-linecap="round"/>
    <circle cx="72" cy="62" r="6" fill="#0B1F33" stroke="#FF7A1A" stroke-width="4"/>
  </g>
  <text x="180" y="92" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" letter-spacing="-2" fill="#0B1F33"><tspan font-weight="400">jit</tspan><tspan font-weight="800" fill="#FF7A1A">cast</tspan></text>
  <text x="186" y="140" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" letter-spacing="0.5" fill="#4A5B6C">Time-series foundation models on TornadoVM</text>
</svg>
