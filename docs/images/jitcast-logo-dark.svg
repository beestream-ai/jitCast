<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" role="img" aria-label="jitcast">
  <title>jitcast</title>
  <g transform="translate(8,8)">
    <rect width="144" height="144" rx="32" fill="#0B1F33"/>
    <!-- quantile fan: q10-q90, q30-q70 bands, then the median -->
    <path d="M84 78 L136 42 L136 118 Z" fill="#FF7A1A" fill-opacity="0.22"/>
    <path d="M84 78 L136 58 L136 100 Z" fill="#FF7A1A" fill-opacity="0.45"/>
    <path d="M84 78 L96 70 L108 76 L120 66 L136 72" fill="none" stroke="#FF7A1A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- history -->
    <path d="M14 96 L26 84 L36 92 L48 70 L58 80 L70 58 L84 78" fill="none" stroke="#E8F1FA" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- forecast start -->
    <line x1="84" y1="24" x2="84" y2="128" stroke="#E8F1FA" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 5"/>
    <circle cx="84" cy="78" r="6" fill="#0B1F33" stroke="#FF7A1A" stroke-width="4"/>
  </g>
  <text x="180" y="92" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" letter-spacing="-2" fill="#E8F1FA"><tspan font-weight="400">jit</tspan><tspan font-weight="800" fill="#FF7A1A">cast</tspan></text>
  <text x="186" y="140" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" letter-spacing="0.5" fill="#9FB3C8">Time-series forecasting on TornadoVM</text>
</svg>
